name: LLVM Style Check with Clang-Format

on:
  pull_request:
    branches:
      - main
      - llvm-test

jobs:
  style-check:
    runs-on: windows-latest  # 或者 ubuntu-latest，看你的需求

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          choco install llvm -y  # Windows 下用 Chocolatey 安装 LLVM

      - name: Check code style with clang-format (CMD)
        shell: cmd
        run: |
          for %%F in (*.cpp *.h *.hpp) do (
            clang-format -style=file --dry-run -Werror %%F
          )
        
