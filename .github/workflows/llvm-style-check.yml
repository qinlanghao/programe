name: LLVM Style Check with Clang-Format

on:
  pull_request:
    branches:
      - main
      - llvm-test

jobs:
  style-check:
    runs-on: ubuntu-latest  # 运行在 Linux (Ubuntu)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check code style with clang-format
        run: |
          ERROR_FOUND=0
          
          # 查找所有 C++ 文件
          CHANGED_FILES=$(find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \))

          for FILE in $CHANGED_FILES; do
            echo "Checking $FILE..."  # 输出当前检测的文件名

            # 生成格式化后的临时文件
            clang-format -style=file "$FILE" > formatted.tmp

            # 比较原文件和格式化后的文件
            if ! diff -u "$FILE" formatted.tmp > diff_output.txt; then
              echo "⚠️ WARNING: File $FILE does not conform to LLVM style!"
              cat diff_output.txt  # 输出具体的格式错误
              ERROR_FOUND=1
            fi
          done

          # 清理临时文件
          rm -f formatted.tmp diff_output.txt

          # 如果有错误，则退出 1 终止 workflow
          if [[ $ERROR_FOUND -eq 1 ]]; then
            echo "❌ Code style issues detected. Please run clang-format to fix the issues."
            exit 1
          else
            echo "✅ All files conform to LLVM style."
          fi
