name: LLVM Style Check with Clang-Format

on:
  pull_request:
    branches:
      - main
      - llvm-test

jobs:
  style-check:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install clang-format
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Check code style with clang-format
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set "ERROR_FOUND=0"

          REM 验证clang-format可用性
          where clang-format || exit /B 1

          REM 获取所有需要检查的文件（扩展可自定义）
          for /F "delims=" %%F in ('git ls-files *.cpp *.h *.hpp *.c *.cc *.cxx *.hxx') do (
            echo Checking %%F...

            REM 生成格式化文件并比较差异
            clang-format -style=file -fallback-style=LLVM "%%F" > "%%F.formatted"
            
            git diff --no-index --ignore-cr-at-eol --exit-code "%%F" "%%F.formatted"
            if !errorlevel! neq 0 (
              echo ERROR: [%%F] does not conform to LLVM style
              echo "===== Differences ====="
              git diff --no-index --ignore-all-space --color=always "%%F" "%%F.formatted"
              echo.
              set "ERROR_FOUND=1"
            )
            del "%%F.formatted" 2>nul
          )

          endlocal
          if %ERROR_FOUND% equ 1 exit 1
          echo All files passed LLVM style check