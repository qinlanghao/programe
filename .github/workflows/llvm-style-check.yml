name: LLVM Style Check

on:
  pull_request:
    branches: [main, llvm-test]

jobs:
  clang-format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 确保获取完整提交历史

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          echo "Installed Clang-Format version: $(clang-format --version)"
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format 100
          echo "Default Clang-Format version: $(clang-format --version)"

      - name: List all files (Debug)
        run: ls -R  # 调试输出目录结构

      - name: Check formatting with custom script (Debug)
        run: |
          echo "Starting custom formatting check..."
          # 获取准确的变更文件列表
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRTUXB "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}")
          echo "Changed files: $CHANGED_FILES"

          ERROR_FOUND=0
          IFS=$'\n'  # 处理含空格的文件名
          for FILE in $CHANGED_FILES; do
            if [[ "$FILE" =~ \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$ ]]; then
              echo "Checking: $FILE"
              
              # 生成格式化临时文件
              TEMP_FILE="${FILE}.formatted"
              clang-format -style=file -fallback-style=LLVM "$FILE" > "$TEMP_FILE"
              
              # 对比差异
              if ! diff -u --color=always "$FILE" "$TEMP_FILE"; then
                echo "::error file=$FILE::Code style issues detected"
                ERROR_FOUND=1
              fi
              rm "$TEMP_FILE"
            fi
          done

          if [ "$ERROR_FOUND" -eq 1 ]; then
            echo "Custom formatting check failed."
            exit 1
          else
            echo "Custom formatting check passed."
          fi

      - name: Run clang-format Lint (DoozyX) (Debug)
        uses: DoozyX/clang-format-lint-action@v0.8
        with:
          source: ./  # 指定源代码根目录
          extensions: c,cc,cpp,cxx,h,hh,hpp,hxx  # 支持的文件扩展名
          clangFormatVersion: 17  # 指定 clang-format 版本
          style: LLVM  # 使用 LLVM 风格
        env:
          DEBUG: true  # 启用调试模式

      - name: Display Action Configuration (Debug)
        run: |
          echo "DoozyX Action Configuration:"
          echo "Source: ${{ steps.run-clang-format-lint.outputs.source }}"
          echo "Extensions: ${{ steps.run-clang-format-lint.outputs.extensions }}"
          echo "clangFormatVersion: ${{ steps.run-clang-format-lint.outputs.clangFormatVersion }}"
          echo "Style: ${{ steps.run-clang-format-lint.outputs.style }}"

      - name: Show Environment Variables (Debug)
        run: |
          printenv | sort