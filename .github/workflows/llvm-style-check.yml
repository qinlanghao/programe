name: LLVM Style Check

on:
  pull_request:
    branches: [main, llvm-test]

jobs:
  clang-format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format 17
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-17 100
          echo "Clang-Format version: $(clang-format --version)"
          which clang-format  # Debug to ensure clang-format is available

      - name: List all files (Debug)
        run: ls -R

      - name: Check formatting with custom script
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRTUXB "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}")
          echo "Changed files: ${CHANGED_FILES}"

          ERROR_FOUND=0
          IFS=$'\n'
          for FILE in $CHANGED_FILES; do
            if [[ "$FILE" =~ \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$ ]]; then
              echo "Checking: $FILE"
              TEMP_FILE="${FILE}.formatted"
              
              # Use the full path if necessary
              clang-format -style=file -fallback-style=LLVM "$FILE" > "$TEMP_FILE"
              
              if ! diff -u --color=always "$FILE" "$TEMP_FILE"; then
                echo "::error file=$FILE::Code style issues detected"
                ERROR_FOUND=1
              fi
              rm "$TEMP_FILE"
            fi
          done

          if [ "$ERROR_FOUND" -eq 1 ]; then
            exit 1
          fi

      - name: Run clang-format Lint (DoozyX)
        uses: DoozyX/clang-format-lint-action@v0.8
        with:
          source: ./  
          extensions: c,cc,cpp,cxx,h,hh,hpp,hxx  
          clangFormatVersion: 17  
          style: LLVM