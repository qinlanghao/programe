name: LLVM Style Check

on:
  pull_request:
    branches: [main, llvm-test]

jobs:
  clang-format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format-18
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/bin/clang-format

      - name: Verify installation
        run: |
          echo "Clang-Format Path: $(which clang-format)"
          clang-format --version

      - name: Run clang-format check
        run: |
          # 获取所有需要检查的文件
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRTUXB HEAD^ HEAD)
          echo "Changed files: $CHANGED_FILES"

          # 执行格式化检查
          ERROR_FOUND=0
          for FILE in $CHANGED_FILES; do
            if [[ $FILE =~ \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$ ]]; then
              echo "Checking $FILE"
              if ! clang-format -style=file --Werror --dry-run "$FILE"; then
                echo "::error file=$FILE::Code style issues detected"
                ERROR_FOUND=1
              fi
            fi
          done

          if [ $ERROR_FOUND -eq 1 ]; then
            exit 1
          fi