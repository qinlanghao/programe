name: LLVM Style Check with Clang-Format

on:
  pull_request:
    branches:
      - main
      - llvm-test

jobs:
  style-check:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          choco install llvm -y

      - name: Check code style with clang-format (CMD)
        shell: cmd
        run: |
          REM 启用延迟变量扩展
          setlocal enabledelayedexpansion
          set "ERROR_FOUND=0"

          REM 遍历当前目录及子目录下所有 C++ 文件
          for /R %%F in (*.cpp *.h *.hpp) do (
            echo Checking %%F...  REM 输出当前检测的文件名

            REM 生成格式化后的临时文件
            clang-format -style=file "%%F" > formatted.tmp
            REM 比较原文件和格式化后的文件
            fc "%%F" formatted.tmp > diff_output.txt
            if errorlevel 1 (
              echo WARNING: File %%F does not conform to LLVM style. Differences:
              type diff_output.txt
              echo.
              set "ERROR_FOUND=1"
            )
          )
          REM 删除临时文件
          del formatted.tmp
          del diff_output.txt

          if "!ERROR_FOUND!"=="1" (
            echo Code style issues detected. Please run clang-format to fix the issues.
            exit /B 1
          ) else (
            echo All files conform to LLVM style.
          )
