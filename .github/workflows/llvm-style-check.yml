name: LLVM Style Check with Clang-Format

on:
  pull_request:
    branches:
      - main
      - llvm-test

jobs:
  style-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Fetch all branches
        run: git fetch --prune --unshallow

      - name: Determine base and head branches
        run: |
          echo "Base Ref: ${{ github.base_ref }}"
          echo "Head Ref: ${{ github.head_ref }}"
          echo "BASE_BRANCH_NAME=${{ github.base_ref }}" >> $GITHUB_ENV
          echo "HEAD_BRANCH_NAME=${{ github.head_ref }}" >> $GITHUB_ENV

      - name: Check code style with clang-format and diff
        run: |
          # 获取当前 PR 的变更文件
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRTUXB origin/$BASE_BRANCH_NAME origin/$HEAD_BRANCH_NAME)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant files changed."
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          ERROR_FOUND=0

          # 遍历所有变更文件
          for FILE in $CHANGED_FILES; do
            if [[ $FILE =~ \.(cpp|h|hpp)$ ]]; then
              echo "DEBUG: Checking file: $FILE"
              # 使用 clang-format 格式化后保存到临时文件
              clang-format -style=LLVM "$FILE" > formatted.tmp
              # 比较原始文件和格式化后的文件
              DIFF=$(diff "$FILE" formatted.tmp)
              if [ "$DIFF" != "" ]; then
                echo "❌ Style issue in $FILE:"
                echo "$DIFF"
                ERROR_FOUND=1
              else
                echo "✅ $FILE conforms to LLVM style."
              fi
              # 输出调试信息，显示文件内容（可选）
              # echo "DEBUG: Original file content:"
              # cat "$FILE"
              # echo "DEBUG: Formatted file content:"
              # cat formatted.tmp
            fi
          done

          # 删除临时文件
          rm -f formatted.tmp

          if [ "$ERROR_FOUND" -eq 1 ]; then
            echo "Code style issues detected. Please run clang-format to fix the issues."
            exit 1
          fi

          echo "✅ All files conform to LLVM style."
