name: LLVM Style Check

on:
  pull_request:
    branches: [main, llvm-test]

jobs:
  clang-format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 确保获取完整提交历史

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
          echo "Clang-Format version: $(clang-format --version)"

      - name: List all files (Debug)
        run: ls -R  # 调试输出目录结构

      - name: Run clang-format Lint (DoozyX)
        uses: DoozyX/clang-format-lint-action@v0.8
        with:
          source: ./  # 指定源代码根目录
          extensions: c,cc,cpp,cxx,h,hh,hpp,hxx  # 支持的文件扩展名
          clangFormatVersion: 18  # 指定 clang-format 版本
          style: LLVM  # 使用 LLVM 风格